name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            args: ""
          - os: ubuntu-latest
            label: linux
            args: ""
          - os: macos-latest
            label: mac
            args: "--x64 --arm64"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.17.0

      - id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run dist -- ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: taxus-${{ steps.pkg.outputs.version }}-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
