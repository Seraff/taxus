name: Build MacOS arm64

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac
            args: "--arm64"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20.17.0

      - id: pkg
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Package app only
        run: npm run dist -- ${{ matrix.args }} --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - dist/mac-arm64/taxus.app
          codesign -dv --verbose=4 dist/mac-arm64/taxus.app

      - name: Build DMG from signed app
        run: npx electron-builder ${{ matrix.args }} --prepackaged dist/mac-arm64/taxus.app --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: taxus-${{ steps.pkg.outputs.version }}-${{ matrix.label }}
          path: dist/*.dmg
